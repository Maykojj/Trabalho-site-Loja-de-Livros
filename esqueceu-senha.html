<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundo Livros - Esqueceu a Senha</title>
  <!-- Link direcionado para o mesmo arquivo de estilos unificado -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= TELA ESQUECEU A SENHA ================= -->
  <div id="forgot-layout" class="login-screen">
    
    <!-- Card de Recuperação Centralizado -->
    <div class="login-card">
      <h2 class="card-title">Esqueceu a senha:</h2>
      
      <!-- Formulário de Recuperação -->
      <form class="login-form" onsubmit="return false;">
        
        <!-- Entrada: Email ou Celular -->
        <div class="login-input-group">
          <label class="input-label">Digite seu Email ou celular:</label>
          <div class="field-wrapper">
            <span class="field-icon">👤</span>
            <input type="text" placeholder="Email ou celular" required class="form-input">
          </div>
        </div>

        <!-- Botão Confirmar Verde -->
        <button type="submit" class="btn-submit">Confirmar</button>
        
        <!-- Links de Ação Finais -->
        <div class="form-footer">
          <a href="#" class="helper-link">Não tem uma conta?</a>
          <a href="login.html" class="btn-voltar-loja">← Voltar para o Login</a>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
