<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundo Livros - Login</title>
  <!-- Link direcionado para o arquivo de estilos unificado -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= TELA DE LOGIN ================= -->
  <div id="login-layout" class="login-screen">
    
    <!-- Cabeçalho Ocre da tela de Login -->
    <header class="login-header">
      <div class="login-logo-area">
        📖 Mundo Livros
      </div>
    </header>

    <!-- Card de Login Centralizado -->
    <div class="login-card">
      <h2 class="card-title">Fazer Login</h2>
      
      <!-- Avatar de Usuário Tracejado -->
      <div class="avatar-container">
        <div class="avatar-circle">
          <div class="avatar-head"></div>
          <div class="avatar-body"></div>
        </div>
      </div>

      <!-- Formulário de Login -->
      <form class="login-form" onsubmit="return false;">
        
        <!-- Entrada: Email ou Celular -->
        <div class="login-input-group">
          <label class="input-label">Digite seu Email ou celular:</label>
          <div class="field-wrapper">
            <span class="field-icon">👤</span>
            <input type="text" placeholder="Email ou celular" required class="form-input">
          </div>
        </div>

        <!-- Entrada: Senha -->
        <div class="login-input-group">
          <label class="input-label">Digite sua senha:</label>
          <div class="field-wrapper">
            <span class="field-icon">🔒</span>
            <input type="password" placeholder="Senha" required class="form-input">
            <span class="toggle-visibility">👁️</span>
          </div>
          <a href="#" class="helper-link">Esqueceu sua senha?</a>
        </div>

        <!-- Botão Confirmar Verde -->
        <button type="submit" class="btn-submit">Confirmar</button>
        
        <!-- Links de Ação Finais -->
        <div class="form-footer">
          <a href="#" class="helper-link">Não tem uma conta?</a>
          <a href="index.html" class="btn-voltar-loja">← Voltar para a Loja</a>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
