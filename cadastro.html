<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundo Livros | Criar Conta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="main-header">
    <div class="header-container">
      <a href="index.html" class="main-logo"><span class="logo-icon">📖</span> Mundo Livros</a>
    </div>
  </header>

  <main class="container">
    <div class="auth-box">
      <div class="auth-header">
        <span class="badge">Cadastro</span>
        <h2>Criar Nova Conta</h2>
      </div>

      <form action="login.html" id="registration-form">
        <div class="form-group">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" name="nome" autocomplete="name" required>
        </div>
        <div class="form-group">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" inputmode="numeric" autocomplete="off" placeholder="Somente números" pattern="[0-9]{11}" title="Digite os 11 números do CPF, sem pontos ou traço." required>
        </div>
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="telefone">Celular</label>
          <input type="tel" id="telefone" name="telefone" inputmode="tel" autocomplete="tel" placeholder="DDD + número" pattern="[0-9]{10,11}" title="Digite o DDD e o número do celular, somente números." required>
        </div>
        <div class="form-group">
          <label for="pass">Senha</label>
          <div class="password-input-wrapper">
            <input type="password" id="pass" name="senha" autocomplete="new-password" minlength="8" aria-describedby="password-requirement" required>
            <button class="password-visibility-toggle" type="button" aria-label="Mostrar senha" aria-pressed="false" aria-controls="pass">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
                <path class="eye-slash" d="m3 3 18 18"></path>
              </svg>
            </button>
          </div>
          <small id="password-requirement">Use pelo menos 8 caracteres.</small>
        </div>
        <div class="form-group">
          <label for="confirm-pass">Confirmar senha</label>
          <div class="password-input-wrapper">
            <input type="password" id="confirm-pass" name="confirmar-senha" autocomplete="new-password" required>
            <button class="password-visibility-toggle" type="button" aria-label="Mostrar confirmação da senha" aria-pressed="false" aria-controls="confirm-pass">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
                <path class="eye-slash" d="m3 3 18 18"></path>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-submit">Finalizar Cadastro</button>
      </form>
    </div>
  </main>
  <script src="cadastro.js"></script>
  <script src="navegacao-site.js"></script>
</body>
</html>
